<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Pizza | Contato</title>
    <link rel="stylesheet" href="assents/CSS/contato.css">
</head>
<body>
    <nav>
        <div class="logo">Lumina.</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cardapio.html">Cardápio</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>
    
    <main class="contact-container">
        <div class="contact-info">
            <h2>Fale Conosco</h2>
            <p>Dúvidas, sugestões ou eventos? Mande uma mensagem direta. Nosso atendimento é humanizado e imediato.</p>
            <div class="info-item">
                <strong>Endereço:</strong><br>
                Rua Conceitual, 404 - Centro
            </div>
            <div class="info-item">
                <strong>Horário:</strong><br>
                Terça a Domingo - 18h às 23h
            </div>
        </div>
        
        <form id="contact-form" class="contact-form">
            <input type="text" id="nome" placeholder="Seu Nome" required>
            <textarea id="mensagem" rows="5" placeholder="Sua Mensagem..." required></textarea>
            <button type="submit">Enviar pelo WhatsApp</button>
        </form>
    </main>
    <script src="assents/JS/contato.js"></script>
</body>
</html>
